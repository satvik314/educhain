[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "educhain"
version = "1.0.0"
description = "Generate educational content with AI - built on the OpenAI SDK, works with any OpenAI-compatible provider."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Satvik Paramkusham", email = "satvik@buildfastwithai.com" },
]
keywords = ["education", "ai", "llm", "openai", "quiz", "mcq", "edtech", "content-generation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Light core: question + content generation, multi-provider, and built-in RAG.
dependencies = [
    "openai>=1.40",
    "pydantic>=2.0,<3.0",
    "numpy>=1.21",
    "python-dotenv>=1.0",
    "requests>=2.28",
    "beautifulsoup4>=4.11",
    "rich>=13.0",
]

[project.optional-dependencies]
# PDF ingestion and PDF/CSV export.
pdf = ["pypdf>=4.0", "reportlab>=4.0"]
# YouTube transcript ingestion.
youtube = ["youtube-transcript-api>=0.6"]
# Visual (chart/table) questions, image input, and CSV export.
visual = ["matplotlib>=3.6", "pandas>=1.5", "dataframe-image>=0.2", "pillow>=9.0"]
# Podcast text-to-speech.
audio = ["gtts>=2.3", "pydub>=0.25", "mutagen>=1.46"]
# Everything above.
all = [
    "pypdf>=4.0", "reportlab>=4.0",
    "youtube-transcript-api>=0.6",
    "matplotlib>=3.6", "pandas>=1.5", "dataframe-image>=0.2", "pillow>=9.0",
    "gtts>=2.3", "pydub>=0.25", "mutagen>=1.46",
]
# Development / testing.
dev = ["pytest>=7.0", "ruff>=0.1"]

[project.urls]
Homepage = "https://educhain.in"
Repository = "https://github.com/satvik314/educhain"
Documentation = "https://github.com/satvik314/educhain/blob/main/docs/index.md"

[tool.setuptools.packages.find]
include = ["educhain*"]
exclude = ["tests*", "cookbook*", "archive*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
